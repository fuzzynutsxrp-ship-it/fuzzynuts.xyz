<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Fuzzynuts — The Nuttiest Platformer on XRPL</title>
    <meta name="description" content="Play Super Fuzzynuts! Guide your squirrel through tree-filled levels, collect nuts, and dodge predator birds in this Fuzzynuts-themed platformer.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0f0a 50%, #0a1a0f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            color: #d4a843;
            overflow: hidden;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 4px;
            text-shadow: 0 0 20px rgba(212,168,67,0.5);
        }
        h1 .emoji { font-size: 1.8rem; }

        .subtitle {
            font-size: 0.85rem;
            color: #8b7355;
            text-align: center;
            margin-bottom: 12px;
        }

        .game-wrapper {
            position: relative;
            border: 3px solid #d4a843;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(212,168,67,0.2), 0 0 80px rgba(212,168,67,0.1);
        }

        #canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #000;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-group {
            text-align: center;
            background: rgba(212,168,67,0.08);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(212,168,67,0.2);
        }

        .control-group .label {
            font-size: 0.65rem;
            color: #6b5b3a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group .keys {
            font-size: 0.9rem;
            color: #d4a843;
            font-weight: 700;
        }

        .back-link {
            margin-top: 16px;
            color: #d4a843;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 1; }

        .footer-note {
            margin-top: 8px;
            font-size: 0.7rem;
            color: #4a3a2a;
        }

        @media (max-width: 680px) {
            h1 { font-size: 1.5rem; }
            .controls { gap: 10px; }
            .control-group { padding: 6px 10px; }
        }
    </style>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.4.2/jquery.min.js"></script>
</head>
<body>
    <h1><span class="emoji">🐿️</span> Super Fuzzynuts</h1>
    <p class="subtitle">Navigate the forest, collect $NUT, dodge the raptors!</p>

    <div class="game-wrapper">
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <div class="label">Move</div>
            <div class="keys">← → Arrow Keys</div>
        </div>
        <div class="control-group">
            <div class="label">Jump</div>
            <div class="keys">S</div>
        </div>
        <div class="control-group">
            <div class="label">Run / Throw Acorn</div>
            <div class="keys">A</div>
        </div>
        <div class="control-group">
            <div class="label">Duck</div>
            <div class="keys">↓</div>
        </div>
    </div>

    <a href="../index.html" class="back-link">← Back to Fuzzynuts.xyz</a>
    <p class="footer-note">Based on Infinite Mario by Notch • Ported by Rob Kleffner • Fuzzynuts Edition</p>

    <!-- Enjine Includes -->
    <script src="Enjine/core.js"></script>
    <script src="Enjine/gameCanvas.js"></script>
    <script src="Enjine/keyboardInput.js"></script>
    <script src="Enjine/resources.js"></script>
    <script src="Enjine/drawable.js"></script>
    <script src="Enjine/state.js"></script>
    <script src="Enjine/gameTimer.js"></script>
    <script src="Enjine/camera.js"></script>
    <script src="Enjine/drawableManager.js"></script>
    <script src="Enjine/sprite.js"></script>
    <script src="Enjine/spriteFont.js"></script>
    <script src="Enjine/frameSprite.js"></script>
    <script src="Enjine/animatedSprite.js"></script>
    <script src="Enjine/collideable.js"></script>
    <script src="Enjine/application.js"></script>

    <!-- Game code -->
    <script src="code/setup.js"></script>
    <script src="code/spriteCuts.js"></script>
    <script src="code/level.js"></script>
    <script src="code/backgroundGenerator.js"></script>
    <script src="code/backgroundRenderer.js"></script>
    <script src="code/improvedNoise.js"></script>
    <script src="code/notchSprite.js"></script>
    <script src="code/character.js"></script>
    <script src="code/levelRenderer.js"></script>
    <script src="code/levelGenerator.js"></script>
    <script src="code/spriteTemplate.js"></script>
    <script src="code/enemy.js"></script>
    <script src="code/fireball.js"></script>
    <script src="code/sparkle.js"></script>
    <script src="code/coinAnim.js"></script>
    <script src="code/mushroom.js"></script>
    <script src="code/particle.js"></script>
    <script src="code/fireFlower.js"></script>
    <script src="code/bulletBill.js"></script>
    <script src="code/flowerEnemy.js"></script>
    <script src="code/shell.js"></script>
    <script src="code/titleState.js"></script>
    <script src="code/loadingState.js"></script>
    <script src="code/loseState.js"></script>
    <script src="code/winState.js"></script>
    <script src="code/mapState.js"></script>
    <script src="code/levelState.js"></script>
    <script src="code/music.js"></script>

    <script>$(document).ready(function() { new Enjine.Application().Initialize(new Mario.LoadingState(), 320, 240) });</script>
</body>
</html>
