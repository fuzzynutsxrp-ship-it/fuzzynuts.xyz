<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <title>Super Fuzzynuts — The Nuttiest Platformer on XRPL</title>
    <meta
      name="keywords"
      content="fuzzynuts, super fuzzynuts, platformer, mario, html5, xrpl, arcade, crypto, game, nut"
    />
    <meta
      name="description"
      content="Play Super Fuzzynuts — a full 32-level platformer with random maps, mods, and a level editor. Part of the Fuzzynuts Arcade on XRPL."
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Super Fuzzynuts — The Nuttiest Platformer"
    />
    <meta
      property="og:description"
      content="32 levels of classic platforming action. Mods, editor, random maps — all in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fuzzynuts.xyz/games/mario/" />

    <!-- Font: non-blocking, loaded async with preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

    <link href="index.css" rel="stylesheet" />
    <link rel="shortcut icon" href="Theme/Mario.gif" />

    <style>
      /* Fuzzynuts Branding — lightweight overrides only */
      header {
        background: #0d0b06 !important;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-bottom: 2px solid #d4a017;
        min-height: 48px;
      }
      header img {
        display: none;
      }

      .fuzzy-brand {
        font-family: "Press Start 2P", "Courier New", monospace;
        color: #d4a017;
        font-size: 18px;
        letter-spacing: 2px;
        white-space: nowrap;
      }
      .fuzzy-brand .nut-emoji {
        margin-right: 8px;
      }

      .fuzzy-nav {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .fuzzy-nav a {
        color: #8b7355;
        text-decoration: none;
        font-size: 12px;
        font-family: "Press Start 2P", "Courier New", monospace;
      }
      .fuzzy-nav a:hover {
        color: #d4a017;
      }

      #header-right {
        display: none;
      }

      body {
        background: #0a0a0a !important;
      }

      #controls {
        border-bottom: 1px solid #1a1208;
      }

      /* Loading screen */
      #fuzzy-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        transition: opacity 0.4s ease;
      }
      #fuzzy-loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      #fuzzy-loader .loader-title {
        font-family: "Press Start 2P", "Courier New", monospace;
        color: #d4a017;
        font-size: 20px;
        letter-spacing: 2px;
      }
      #fuzzy-loader .loader-bar {
        width: 200px;
        height: 4px;
        background: #1a1208;
        border-radius: 2px;
        overflow: hidden;
      }
      #fuzzy-loader .loader-fill {
        height: 100%;
        width: 30%;
        background: #d4a017;
        border-radius: 2px;
        animation: loaderSlide 1.2s ease-in-out infinite;
      }
      @keyframes loaderSlide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(400%);
        }
      }
    </style>
    <!-- Preload the heavy bundle so download starts ASAP -->
    <link rel="preload" href="FullScreenMario.bundle.js" as="script" />
  </head>

  <body>
    <header>
      <div class="fuzzy-brand">
        <span class="nut-emoji">🐿️</span>SUPER FUZZYNUTS
      </div>
      <div class="fuzzy-nav">
        <a
          href="/#games"
          onclick="
            if (window.parent !== window) {
              event.preventDefault();
              window.parent.postMessage({ type: 'FUZZY_NAV_BACK' }, '*');
            }
          "
          >← Arcade</a
        >
        <a href="../../">Home</a>
      </div>
    </header>

    <!-- Loading screen (renders instantly while JS parses) -->
    <div id="fuzzy-loader">
      <div class="loader-title">🐿️ LOADING...</div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <section id="game">
      <!-- FSM.UserWrapper will fill out this section... -->
    </section>

    <section id="controls">
      <!-- FSM.UserWrapper will fill out this section... -->
    </section>

    <!-- Clean up stale FSM score data from localStorage -->
    <script type="text/javascript">
      (function () {
        var keys = [
          "score",
          "coins",
          "lives",
          "world",
          "time",
          "traveled",
          "power",
        ];
        for (var i = 0; i < keys.length; i++) {
          localStorage.removeItem("FullScreenMario" + keys[i]);
        }
      })();
    </script>

    <!-- All game engine scripts concatenated into one file -->
    <script src="FullScreenMario.bundle.js" type="text/javascript"></script>

    <!--
      MONKEY-PATCHES for Fuzzynuts Arcade:
      1. gameStart: Force score/coins reset on Game Over restart
      2. setMap: If lives <= 0 (dying), redirect to full gameStart
         instead of allowing map-hop exploit during death animation
    -->
    <script type="text/javascript">
      (function () {
        "use strict";
        var patchCheck = setInterval(function () {
          if (
            typeof FullScreenMario !== "undefined" &&
            FullScreenMario.FullScreenMario &&
            FullScreenMario.FullScreenMario.prototype
          ) {
            var proto = FullScreenMario.FullScreenMario.prototype;

            // --- Patch 1: gameStart resets score/coins ---
            var originalGameStart = proto.gameStart;
            proto.gameStart = function () {
              var FSM = proto.ensureCorrectCaller(this);
              if (FSM.ItemsHolder) {
                FSM.ItemsHolder.setItem("score", 0);
                FSM.ItemsHolder.setItem("coins", 0);
              }
              return originalGameStart.call(this);
            };

            // --- Patch 2: setMap guards against negative-lives exploit ---
            // When the player dies on their last life, there's a ~5s window
            // before gameOver fires. During that window, clicking a map in
            // the Maps UI calls setMap() directly — bypassing gameOver.
            // This lets the player continue with negative lives + stacked score.
            // Fix: if lives <= 0 when setMap is called, force a full gameStart.
            var originalSetMap = proto.setMap;
            proto.setMap = function (name, location) {
              var FSM = proto.ensureCorrectCaller(this);
              if (FSM.ItemsHolder && FSM.ItemsHolder.getItem("lives") <= 0) {
                // Player is dead — cancel any pending gameOver event
                if (FSM.TimeHandler) {
                  FSM.TimeHandler.cancelAllEvents();
                }
                // Full reset, then load the requested map
                FSM.ItemsHolder.setItem("score", 0);
                FSM.ItemsHolder.setItem("coins", 0);
                FSM.ItemsHolder.setItem(
                  "lives",
                  FSM.settings.statistics.values.lives.valueDefault,
                );
                return originalSetMap.call(this, name, location);
              }
              return originalSetMap.call(this, name, location);
            };

            clearInterval(patchCheck);
            console.log("[Fuzzynuts] Patched gameStart + setMap");
          }
        }, 100);
      })();
    </script>

    <!-- Fuzzynuts Arcade Score Submitter (shared localStorage) -->
    <script src="../fuzzy-score.js" type="text/javascript"></script>
    <script type="text/javascript">
      (function () {
        "use strict";
        var gameStartTime = Date.now();
        var lastSavedScore = 0;

        function saveScore() {
          try {
            if (typeof FSM === "undefined" || !FSM || !FSM.ItemsHolder) return;
            var score = FSM.ItemsHolder.getItem("score") || 0;

            // Only submit if score increased (skip 0 on restart)
            if (score > 0 && score > lastSavedScore) {
              var duration = Math.floor((Date.now() - gameStartTime) / 1000);
              FuzzyScoreSubmit("mario", score, duration);
              lastSavedScore = score;
            }

            // Detect game restart: score went to 0 while we had a previous score
            if (score === 0 && lastSavedScore > 0) {
              lastSavedScore = 0;
              gameStartTime = Date.now();
            }
          } catch (e) {
            /* silent */
          }
        }

        // Wait for game engine, then start polling + hide loader
        var readyCheck = setInterval(function () {
          if (typeof FSM !== "undefined" && FSM && FSM.ItemsHolder) {
            clearInterval(readyCheck);
            // Hide loading screen
            var loader = document.getElementById("fuzzy-loader");
            if (loader) {
              loader.classList.add("hide");
              setTimeout(function () {
                loader.remove();
              }, 500);
            }
            // Save periodically (every 15s)
            setInterval(saveScore, 15000);
          }
        }, 500);

        // Always save on page exit
        window.addEventListener("beforeunload", saveScore);

        // Save when tab loses focus
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) saveScore();
        });
      })();
    </script>
  </body>
</html>
