    <style>
        /* ── Global reset ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            width: 100vw;
            background: #0a0a14;
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            /* Safe area for notch/gesture-bar devices */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }


        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a14 70%);
            transition: opacity 0.6s ease;
        }
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-icon {
            font-size: 4rem;
            animation: bounce 1.5s ease infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .loading-title {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f5a623, #4CAF50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.8rem;
        }
        .loading-subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .loading-bar-track {
            width: 280px;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5a623, #4CAF50);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .loading-status {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.35);
        }

        /* ══════ GAME CANVAS ══════ */
        .game {
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            border: 0;
            width: 100vw;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            overflow: hidden;
            display: block;
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
            touch-action: none;
        }

        /* ══════ MOBILE CONTROLS HINT ══════ */
        .mobile-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(10,10,20,0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(245,166,35,0.2);
            border-radius: 10px;
            padding: 0.6rem 1.2rem;
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
            font-family: 'Outfit', sans-serif;
            text-align: center;
            opacity: 0;
            animation: fadeHint 4s 3s forwards;
            pointer-events: none;
        }
        @keyframes fadeHint {
            0% { opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }

        /* ══════ ARCADE SCORE HUD ══════ */
        #scoreHud {
            position: fixed;
            top: 50px;
            right: 12px;
            z-index: 9000;
            display: none;
            font-family: 'Outfit', sans-serif;
            pointer-events: none;
        }
        #scoreHud.visible { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

        .hud-score-box {
            background: rgba(10,10,20,0.82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(245,166,35,0.2);
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-label {
            font-size: 0.6rem;
            font-weight: 600;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .hud-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f5a623;
        }
        .hud-hole-info {
            background: rgba(10,10,20,0.7);
            border: 1px solid rgba(76,175,80,0.2);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.5);
        }
        .hud-hole-info span { color: #4CAF50; font-weight: 700; }

        /* Score pop-up flash when points change */
        .hud-flash {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9500;
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #f5a623;
            text-shadow: 0 0 20px rgba(245,166,35,0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }
        .hud-flash.show {
            opacity: 1;
            transform: translate(-50%, -60%);
        }
        .hud-flash.fade {
            opacity: 0;
            transform: translate(-50%, -80%);
        }

        @media (max-width: 500px) {
            #scoreHud { top: 8px; right: 6px; }
            .hud-score-box { padding: 4px 8px; }
            .hud-value { font-size: 0.8rem; }
        }

        /* ══════ LANDSCAPE ORIENTATION TOAST ══════ */
        /* Non-blocking toast — does NOT cover the game */
        .orient-toast {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20000;
            background: rgba(10,10,20,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(245,166,35,0.3);
            border-radius: 12px;
            padding: 10px 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.85);
            text-align: center;
            max-width: 320px;
            pointer-events: auto;
            animation: toastSlide 0.4s ease-out;
        }
        .orient-toast .toast-icon { font-size: 1.2rem; margin-right: 6px; }
        .orient-toast .toast-close {
            margin-left: 12px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 1rem;
            cursor: pointer;
            padding: 0 4px;
        }
        @keyframes toastSlide {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        /* Show only on touch devices in portrait */
        @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
            .orient-toast { display: flex; align-items: center; }
        }
        .orient-toast.dismissed { display: none !important; }
    </style>

    <!-- ═══ EMSCRIPTEN BOOTSTRAP ═══ -->
    <script type='text/javascript'>
        // Loading progress tracking
        const loadingBar = document.getElementById('loadingBar');
        const loadingStatus = document.getElementById('loadingStatus');
        const loadingScreen = document.getElementById('loadingScreen');
        let loadProgress = 0;

        function updateProgress(pct, msg) {
            loadProgress = Math.max(loadProgress, pct);
            if (loadingBar) loadingBar.style.width = loadProgress + '%';
            if (loadingStatus && msg) loadingStatus.textContent = msg;
        }

        var Module = {
            preRun: [],
            postRun: [function() {
                // Game loaded — hide loading screen
                updateProgress(100, 'Ready!');
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    // Show mobile hint only on touch devices
                    if ('ontouchstart' in window) {
                        document.getElementById('mobileHint').style.opacity = '1';
                    }
                    // Start the score tracker
                    NutGolfScoreTracker.init();
                }, 400);
            }],
            print: (function() {
                return function(text) {
                    text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    // Notify score tracker of game output
                    if (typeof NutGolfScoreTracker !== 'undefined') {
                        NutGolfScoreTracker.onGameOutput(text);
                    }
                };
            })(),
            printErr: function(text) {
                text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })(),
            setStatus: function(text) {
                console.log("status: " + text);
                // Parse Emscripten loading progress
                if (text) {
                    const match = text.match(/(\d+)\/(\d+)/);
                    if (match) {
                        const pct = Math.round((parseInt(match[1]) / parseInt(match[2])) * 90);
                        updateProgress(pct, text);
                    } else if (text.indexOf('Running') >= 0) {
                        updateProgress(95, 'Starting game…');
                    } else {
                        updateProgress(loadProgress + 5, text);
                    }
                }
            },
            monitorRunDependencies: function(left) {
                console.log("monitor run deps: " + left);
                if (left === 0) {
                    updateProgress(90, 'Finalizing…');
                }
            }
        };
        window.onerror = function(message, source, lineno, colno, error) {
            console.log("onerror: " + message + " at " + source + ":" + lineno);
        };
    </script>
    <script async type="text/javascript" src="golf.js"></script>

    <!-- ═══ NUT GOLF SCORE TRACKER ═══ -->
    <script>
    /**
     * NutGolfScoreTracker — Intercepts the Emscripten FS to read stroke
     * counts saved by the game, computes an arcade-friendly composite score,
     * and submits it via FuzzyScoreSubmit.
     *
     * Scoring formula (per hole):
     *   Hole-In-One (1 stroke) → 500 pts
     *   2 strokes              → 300 pts
     *   3 strokes              → 200 pts
     *   4 strokes              → 150 pts
     *   5 strokes              → 100 pts
     *   6 strokes              →  75 pts
     *   7 strokes              →  50 pts
     *   8+ strokes             →  25 pts
     *
     * Max possible (all HIO): 20 × 500 = 10,000 points
     * Completing all 20 holes adds a +500 completion bonus.
     */
    var NutGolfScoreTracker = (function() {
        'use strict';

        var TOTAL_HOLES = 20;
        var STROKE_POINTS = [0, 500, 300, 200, 150, 100, 75, 50]; // index = strokes
        var MIN_STROKE_POINTS = 25;
        var COMPLETION_BONUS = 500;

        // State
        var strokeData = {};     // { level_num: stroke_count }
        var arcadeScore = 0;
        var totalStrokes = 0;
        var holesCompleted = 0;
        var gameStartTime = 0;
        var lastKnownScore = 0;
        var pollInterval = null;
        var isInitialized = false;

        // DOM refs
        var hudEl, hudScoreEl, hudHolesEl, hudStrokesEl, flashEl;

        function init() {
            if (isInitialized) return;
            isInitialized = true;
            gameStartTime = Date.now();

            hudEl = document.getElementById('scoreHud');
            hudScoreEl = document.getElementById('hudScore');
            hudHolesEl = document.getElementById('hudHolesCompleted');
            hudStrokesEl = document.getElementById('hudTotalStrokes');
            flashEl = document.getElementById('scoreFlash');

            // Start polling the Emscripten FS for saved stroke counts
            pollInterval = setInterval(pollScores, 2000);

            console.log('[NutGolf] Score tracker initialized');
        }

        function computeScore(strokes) {
            if (strokes <= 0) return 0;
            if (strokes < STROKE_POINTS.length) return STROKE_POINTS[strokes];
            return MIN_STROKE_POINTS;
        }

        function pollScores() {
            // The game saves all data to a single JSON file:
            // /opengolf_persistent_data/storage.json
            // Format: { "stroke_count_level_0": 3, "stroke_count_level_1": 5, ... }
            var FS = null;
            try { FS = Module.FS; } catch(e) { return; }
            if (!FS) return;

            var jsonPath = '/opengolf_persistent_data/storage.json';
            try {
                if (!FS.analyzePath(jsonPath).exists) return;
                var raw = new TextDecoder().decode(FS.readFile(jsonPath));
                var data = JSON.parse(raw);
                var changed = false;

                for (var i = 0; i < TOTAL_HOLES; i++) {
                    var key = 'stroke_count_level_' + i;
                    if (data[key] !== undefined && data[key] !== null) {
                        var val = Math.round(data[key]);
                        if (val > 0 && strokeData[i] !== val) {
                            strokeData[i] = val;
                            changed = true;
                        }
                    }
                }

                if (changed) {
                    recalculate();
                }
            } catch(e) {
                // JSON not yet created or parse error — game hasn't saved yet
            }
        }

        function recalculate() {
            var newScore = 0;
            var newStrokes = 0;
            var newHoles = 0;

            for (var i = 0; i < TOTAL_HOLES; i++) {
                if (strokeData[i] && strokeData[i] > 0) {
                    newHoles++;
                    newStrokes += strokeData[i];
                    newScore += computeScore(strokeData[i]);
                }
            }

            // Completion bonus
            if (newHoles >= TOTAL_HOLES) {
                newScore += COMPLETION_BONUS;
            }

            holesCompleted = newHoles;
            totalStrokes = newStrokes;

            if (newScore !== arcadeScore) {
                var delta = newScore - arcadeScore;
                arcadeScore = newScore;
                updateHud();
                if (delta > 0) {
                    showScoreFlash('+' + delta);
                }
                submitScore();
            }
        }

        function updateHud() {
            if (!hudEl) return;
            hudEl.classList.add('visible');
            if (hudScoreEl) hudScoreEl.textContent = arcadeScore.toLocaleString();
            if (hudHolesEl) hudHolesEl.textContent = holesCompleted;
            if (hudStrokesEl) hudStrokesEl.textContent = totalStrokes;
        }

        function showScoreFlash(text) {
            if (!flashEl) return;
            flashEl.textContent = text;
            flashEl.className = 'hud-flash show';
            setTimeout(function() { flashEl.className = 'hud-flash fade'; }, 1200);
            setTimeout(function() { flashEl.className = 'hud-flash'; }, 1800);
        }

        function submitScore() {
            if (arcadeScore <= 0 || arcadeScore === lastKnownScore) return;
            lastKnownScore = arcadeScore;

            var duration = Math.floor((Date.now() - gameStartTime) / 1000);
            if (typeof FuzzyScoreSubmit === 'function') {
                var result = FuzzyScoreSubmit('minigolf', arcadeScore, duration);
                console.log('[NutGolf] Score submitted:', arcadeScore, 'pts',
                           '(' + holesCompleted + ' holes, ' + totalStrokes + ' strokes)',
                           result);
            }
        }

        function onGameOutput(text) {
            // The game prints "SAVED" when it syncs to IDBFS
            if (text === 'SAVED') {
                // Trigger an immediate poll after save
                setTimeout(pollScores, 500);
            }
        }

        // Also try reading from localStorage as a fallback
        // Open-Golf's storage.c uses a key-value store backed by IDBFS
        // But we can also try checking if data is accessible via the file API
        function tryLocalStorageFallback() {
            // The game may store numeric values as raw files
            // We poll the FS directly which is the most reliable approach
        }

        // Submit final score when leaving the page
        if (typeof window !== 'undefined') {
            window.addEventListener('beforeunload', function() {
                if (arcadeScore > 0) {
                    submitScore();
                }
            });
        }

        return {
            init: init,
            onGameOutput: onGameOutput,
            getScore: function() { return arcadeScore; },
            getStrokes: function() { return strokeData; }
        };
    })();
    </script>

    <!-- ═══ NAV AUTO-HIDE DURING GAMEPLAY ═══ -->
    <script>
        // The nav bar stays visible for the first 5 seconds then auto-hides
        // It re-appears on mouse hover near the top edge
        (function() {
            const nav = document.getElementById('fuzzyNav');
            if (!nav) return;

            let hideTimer;

            function startHideTimer() {
                clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                    nav.classList.add('hidden');
                }, 5000);
            }

            // Show nav when mouse is near the top 40px
            document.addEventListener('mousemove', (e) => {
                if (e.clientY < 40) {
                    nav.classList.remove('hidden');
                    startHideTimer();
                }
            });

            // Show nav on touch at top edge
            document.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                if (touch && touch.clientY < 40) {
                    nav.classList.remove('hidden');
                    startHideTimer();
                }
            });

            // Keep nav visible while loading
            const checkLoading = setInterval(() => {
                if (loadingScreen && loadingScreen.classList.contains('hidden')) {
                    startHideTimer();
                    clearInterval(checkLoading);
                }
            }, 500);
        })();

        // ── Landscape toast dismiss ──
        (function() {
            const toast = document.getElementById('orientToast');
            const close = document.getElementById('orientClose');
            if (!toast || !close) return;
            close.addEventListener('click', () => toast.classList.add('dismissed'));
            // Auto-dismiss after 6 seconds
            setTimeout(() => toast.classList.add('dismissed'), 6000);
            // Auto-dismiss on rotation to landscape
            if (screen.orientation) {
                screen.orientation.addEventListener('change', () => {
                    if (screen.orientation.type.startsWith('landscape')) {
                        toast.classList.add('dismissed');
                    }
                });
            }
        })();

        // ── Touch-to-Mouse forwarding for Emscripten canvas ──
        // Open Golf was compiled for mouse events. Mobile browsers fire
        // touch events but NOT mouse events by default on canvas elements
        // with touch-action:none. This proxy ensures taps register as clicks.
        (function() {
            const canvas = document.getElementById('canvas');
            if (!canvas) return;

            function touchToMouse(type, touch, e) {
                const mouseEvent = new MouseEvent(type, {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    screenX: touch.screenX,
                    screenY: touch.screenY,
                    button: 0,
                    buttons: type === 'mouseup' ? 0 : 1,
                    bubbles: true,
                    cancelable: true
                });
                canvas.dispatchEvent(mouseEvent);
            }

            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const t = e.changedTouches[0];
                touchToMouse('mousedown', t, e);
            }, { passive: false });

            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const t = e.changedTouches[0];
                touchToMouse('mousemove', t, e);
            }, { passive: false });

            canvas.addEventListener('touchend', function(e) {
                e.preventDefault();
                const t = e.changedTouches[0];
                touchToMouse('mouseup', t, e);
            }, { passive: false });
        })();
    </script>
