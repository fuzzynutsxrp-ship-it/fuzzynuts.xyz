<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Fuzzynuts 🐿️ — The Game</title>
  <meta name="description" content="Play Flappy Fuzzynuts! Guide our squirrel through the nut trees. A Fuzzynuts ($NUT) community game on XRPL.">
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #0A0A0F;
      color: #F0EDE6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    canvas {
      display: block;
      border-radius: 16px;
      border: 3px solid #F5A623;
      box-shadow: 0 0 40px rgba(245, 166, 35, 0.3), 0 0 80px rgba(245, 166, 35, 0.1);
      cursor: pointer;
      max-width: 100vw;
      max-height: 80vh;
    }

    .game-header {
      text-align: center;
    }

    .game-header h1 {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #F5A623, #FFD777);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .game-header p {
      font-size: 0.85rem;
      opacity: 0.6;
      margin-top: 4px;
    }

    .back-link {
      color: #F5A623;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 1; }

    .controls-hint {
      font-size: 0.75rem;
      opacity: 0.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-header">
      <h1>🐿️ Flappy Fuzzynuts</h1>
      <p>Tap or press Space to flap!</p>
    </div>
    <canvas id="game" width="400" height="600"></canvas>
    <a href="index.html" class="back-link">← Back to Fuzzynuts.xyz</a>
    <div class="controls-hint">Space / Click / Tap to play</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // ═══ GAME STATE ═══
    let gameState = 'start'; // start, playing, dead
    let score = 0;
    let highScore = parseInt(localStorage.getItem('flappynut_hi') || '0');
    let frameCount = 0;

    // ═══ COLORS (Fuzzynuts brand) ═══
    const COLORS = {
      sky1: '#1B4332',
      sky2: '#0A0A0F',
      ground: '#5C3D1F',
      groundLine: '#8B5E34',
      pipe: '#2D6A4F',
      pipeEdge: '#1B4332',
      pipeCap: '#3D8B6A',
      pipeCapEdge: '#245F40',
      gold: '#F5A623',
      goldLight: '#FFD777',
      text: '#F0EDE6',
      brown: '#8B5E34',
    };

    // ═══ SQUIRREL (player) ═══
    const squirrel = {
      x: 80,
      y: H / 2,
      w: 36,
      h: 30,
      vy: 0,
      gravity: 0.45,
      jumpForce: -7.5,
      rotation: 0,
      tailWag: 0,
    };

    // ═══ PIPES ═══
    let pipes = [];
    const PIPE_W = 60;
    const PIPE_GAP = 155;
    const PIPE_SPEED = 2.5;
    const PIPE_SPAWN = 110; // frames between pipes

    // ═══ GROUND ═══
    const GROUND_H = 60;
    let groundX = 0;

    // ═══ PARTICLES ═══
    let particles = [];

    // ═══ BONUS NUTS (collectibles in the gaps) ═══
    let bonusNuts = [];

    // ═══ STARS (background) ═══
    const stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * (H - GROUND_H),
        size: Math.random() * 2 + 0.5,
        twinkle: Math.random() * Math.PI * 2,
      });
    }

    // ═══ DRAWING FUNCTIONS ═══

    function drawBackground() {
      // Sky gradient
      const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
      grad.addColorStop(0, COLORS.sky2);
      grad.addColorStop(0.6, COLORS.sky1);
      grad.addColorStop(1, '#245F40');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H - GROUND_H);

      // Stars
      stars.forEach(s => {
        const alpha = 0.3 + 0.4 * Math.sin(s.twinkle + frameCount * 0.02);
        ctx.fillStyle = `rgba(255, 215, 119, ${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Distant trees silhouette
      ctx.fillStyle = 'rgba(27, 67, 50, 0.5)';
      for (let x = 0; x < W; x += 40) {
        const h = 30 + Math.sin(x * 0.05) * 20 + Math.cos(x * 0.03) * 15;
        ctx.beginPath();
        ctx.moveTo(x, H - GROUND_H);
        ctx.lineTo(x + 20, H - GROUND_H - h);
        ctx.lineTo(x + 40, H - GROUND_H);
        ctx.fill();
      }
    }

    function drawGround() {
      // Main ground
      ctx.fillStyle = COLORS.ground;
      ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

      // Top line
      ctx.fillStyle = COLORS.groundLine;
      ctx.fillRect(0, H - GROUND_H, W, 4);

      // Scrolling texture
      ctx.fillStyle = '#4A2E15';
      for (let x = -40 + (groundX % 40); x < W + 40; x += 40) {
        ctx.fillRect(x, H - GROUND_H + 12, 20, 3);
        ctx.fillRect(x + 10, H - GROUND_H + 25, 15, 3);
      }

      // Grass tufts
      ctx.fillStyle = '#3D8B6A';
      for (let x = -20 + (groundX % 30); x < W + 30; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, H - GROUND_H);
        ctx.lineTo(x + 4, H - GROUND_H - 8);
        ctx.lineTo(x + 8, H - GROUND_H);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x + 5, H - GROUND_H);
        ctx.lineTo(x + 10, H - GROUND_H - 11);
        ctx.lineTo(x + 15, H - GROUND_H);
        ctx.fill();
      }
    }

    function drawPipe(pipe) {
      const capH = 20;
      const capOverhang = 6;

      // ── Top pipe (tree trunk) ──
      // Trunk
      ctx.fillStyle = COLORS.pipe;
      ctx.fillRect(pipe.x, 0, PIPE_W, pipe.topH - capH);
      // Trunk bark texture
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      for (let y = 10; y < pipe.topH - capH; y += 18) {
        ctx.fillRect(pipe.x + 8, y, PIPE_W - 16, 2);
      }
      // Cap (knot)
      ctx.fillStyle = COLORS.pipeCap;
      ctx.beginPath();
      ctx.roundRect(pipe.x - capOverhang, pipe.topH - capH, PIPE_W + capOverhang * 2, capH, [0, 0, 6, 6]);
      ctx.fill();
      ctx.strokeStyle = COLORS.pipeCapEdge;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Vine on top pipe
      ctx.strokeStyle = '#3D8B6A';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pipe.x + PIPE_W - 5, 0);
      ctx.quadraticCurveTo(pipe.x + PIPE_W + 10, pipe.topH * 0.3, pipe.x + PIPE_W - 8, pipe.topH * 0.6);
      ctx.stroke();

      // ── Bottom pipe (tree trunk) ──
      const botY = pipe.topH + PIPE_GAP;
      const botH = H - GROUND_H - botY;
      // Trunk
      ctx.fillStyle = COLORS.pipe;
      ctx.fillRect(pipe.x, botY + capH, PIPE_W, botH - capH);
      // Bark
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      for (let y = botY + capH + 10; y < botY + botH; y += 18) {
        ctx.fillRect(pipe.x + 8, y, PIPE_W - 16, 2);
      }
      // Cap
      ctx.fillStyle = COLORS.pipeCap;
      ctx.beginPath();
      ctx.roundRect(pipe.x - capOverhang, botY, PIPE_W + capOverhang * 2, capH, [6, 6, 0, 0]);
      ctx.fill();
      ctx.strokeStyle = COLORS.pipeCapEdge;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawSquirrel() {
      ctx.save();
      ctx.translate(squirrel.x + squirrel.w / 2, squirrel.y + squirrel.h / 2);

      // Rotation based on velocity
      const targetRot = Math.min(Math.max(squirrel.vy * 4, -30), 70);
      squirrel.rotation += (targetRot - squirrel.rotation) * 0.15;
      ctx.rotate(squirrel.rotation * Math.PI / 180);

      const bx = -squirrel.w / 2;
      const by = -squirrel.h / 2;

      // Fluffy tail
      squirrel.tailWag = Math.sin(frameCount * 0.15) * 6;
      ctx.fillStyle = '#C78415';
      ctx.beginPath();
      ctx.ellipse(bx - 4, by + 2 + squirrel.tailWag, 12, 16, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#E5A830';
      ctx.beginPath();
      ctx.ellipse(bx - 2, by + 4 + squirrel.tailWag, 8, 12, -0.5, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.fillStyle = '#C78415';
      ctx.beginPath();
      ctx.ellipse(0, 2, squirrel.w / 2 - 2, squirrel.h / 2 - 1, 0, 0, Math.PI * 2);
      ctx.fill();

      // Belly
      ctx.fillStyle = '#FFD777';
      ctx.beginPath();
      ctx.ellipse(3, 4, 10, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.fillStyle = '#D4922B';
      ctx.beginPath();
      ctx.arc(bx + squirrel.w - 4, by + 6, 11, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.fillStyle = '#B07820';
      ctx.beginPath();
      ctx.ellipse(bx + squirrel.w - 10, by - 4, 4, 6, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(bx + squirrel.w + 1, by - 3, 4, 6, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Inner ears
      ctx.fillStyle = '#FFD777';
      ctx.beginPath();
      ctx.ellipse(bx + squirrel.w - 10, by - 3, 2, 3, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(bx + squirrel.w + 1, by - 2, 2, 3, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.arc(bx + squirrel.w + 2, by + 5, 3, 0, Math.PI * 2);
      ctx.fill();
      // Eye shine
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(bx + squirrel.w + 3, by + 4, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Nose
      ctx.fillStyle = '#5C3D1F';
      ctx.beginPath();
      ctx.ellipse(bx + squirrel.w + 9, by + 8, 2.5, 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Mouth / cheek
      ctx.fillStyle = '#E8B45A';
      ctx.beginPath();
      ctx.arc(bx + squirrel.w + 3, by + 11, 4, 0, Math.PI * 2);
      ctx.fill();

      // Little arms holding nut while playing
      if (gameState === 'playing') {
        ctx.fillStyle = '#C78415';
        ctx.beginPath();
        ctx.ellipse(bx + squirrel.w + 4, by + squirrel.h - 4, 3, 5, 0.4, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawBonusNut(nut) {
      ctx.save();
      ctx.translate(nut.x, nut.y);
      ctx.rotate(frameCount * 0.05);
      // Glow
      ctx.fillStyle = 'rgba(245, 166, 35, 0.25)';
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fill();
      // Acorn body
      ctx.fillStyle = COLORS.gold;
      ctx.beginPath();
      ctx.ellipse(0, 2, 8, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      // Acorn cap
      ctx.fillStyle = COLORS.brown;
      ctx.beginPath();
      ctx.ellipse(0, -5, 9, 5, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      // Stem
      ctx.strokeStyle = COLORS.brown;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(0, -14);
      ctx.stroke();
      ctx.restore();
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawScore() {
      // Score
      ctx.fillStyle = COLORS.goldLight;
      ctx.font = '900 48px Outfit';
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 4;
      ctx.strokeText(score, W / 2, 60);
      ctx.fillText(score, W / 2, 60);
    }

    function drawStartScreen() {
      // Darken
      ctx.fillStyle = 'rgba(10, 10, 15, 0.7)';
      ctx.fillRect(0, 0, W, H);

      // Title
      ctx.fillStyle = COLORS.goldLight;
      ctx.font = '900 36px Outfit';
      ctx.textAlign = 'center';
      ctx.fillText('🐿️ Flappy', W / 2, H / 2 - 80);
      ctx.fillText('Fuzzynuts', W / 2, H / 2 - 38);

      // Subtitle
      ctx.fillStyle = COLORS.text;
      ctx.font = '600 16px Outfit';
      ctx.globalAlpha = 0.7;
      ctx.fillText('Navigate through the Nut Trees!', W / 2, H / 2 + 10);
      ctx.globalAlpha = 1;

      // Tap instruction (pulsing)
      const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.06);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = COLORS.gold;
      ctx.font = '700 20px Outfit';
      ctx.fillText('Tap or Press Space', W / 2, H / 2 + 60);
      ctx.globalAlpha = 1;

      // High score
      if (highScore > 0) {
        ctx.fillStyle = COLORS.text;
        ctx.font = '600 14px Outfit';
        ctx.globalAlpha = 0.5;
        ctx.fillText(`Best: ${highScore} 🥜`, W / 2, H / 2 + 100);
        ctx.globalAlpha = 1;
      }
    }

    function drawDeathScreen() {
      ctx.fillStyle = 'rgba(10, 10, 15, 0.75)';
      ctx.fillRect(0, 0, W, H);

      // Game Over
      ctx.fillStyle = '#FF6B6B';
      ctx.font = '900 40px Outfit';
      ctx.textAlign = 'center';
      ctx.fillText('BONK! 💥', W / 2, H / 2 - 60);

      // Score card
      ctx.fillStyle = COLORS.goldLight;
      ctx.font = '700 22px Outfit';
      ctx.fillText(`Score: ${score}`, W / 2, H / 2 - 10);

      if (score >= highScore && score > 0) {
        ctx.fillStyle = '#4ADE80';
        ctx.font = '700 16px Outfit';
        ctx.fillText('🎉 NEW BEST! 🎉', W / 2, H / 2 + 20);
      }

      ctx.fillStyle = COLORS.text;
      ctx.font = '600 14px Outfit';
      ctx.globalAlpha = 0.5;
      ctx.fillText(`Best: ${highScore} 🥜`, W / 2, H / 2 + 50);
      ctx.globalAlpha = 1;

      const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.08);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = COLORS.gold;
      ctx.font = '700 18px Outfit';
      ctx.fillText('Tap to Try Again', W / 2, H / 2 + 90);
      ctx.globalAlpha = 1;
    }

    // ═══ GAME LOGIC ═══

    function spawnPipe() {
      const minTop = 80;
      const maxTop = H - GROUND_H - PIPE_GAP - 80;
      const topH = minTop + Math.random() * (maxTop - minTop);
      pipes.push({
        x: W + 20,
        topH: topH,
        scored: false,
      });
      // Bonus nut in the gap
      if (Math.random() < 0.6) {
        bonusNuts.push({
          x: W + 20 + PIPE_W / 2,
          y: topH + PIPE_GAP / 2,
          collected: false,
        });
      }
    }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 4 + 1,
          life: 1,
          color: color,
        });
      }
    }

    function flap() {
      if (gameState === 'start') {
        gameState = 'playing';
        squirrel.y = H / 2;
        squirrel.vy = squirrel.jumpForce;
        pipes = [];
        bonusNuts = [];
        particles = [];
        score = 0;
        frameCount = 0;
        return;
      }
      if (gameState === 'dead') {
        gameState = 'start';
        squirrel.y = H / 2;
        squirrel.vy = 0;
        squirrel.rotation = 0;
        return;
      }
      if (gameState === 'playing') {
        squirrel.vy = squirrel.jumpForce;
        spawnParticles(squirrel.x, squirrel.y + squirrel.h / 2, COLORS.goldLight, 4);
      }
    }

    function die() {
      gameState = 'dead';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappynut_hi', highScore.toString());
      }
      spawnParticles(squirrel.x + squirrel.w / 2, squirrel.y + squirrel.h / 2, '#FF6B6B', 15);
    }

    function checkCollision() {
      const sx = squirrel.x + 4;
      const sy = squirrel.y + 4;
      const sw = squirrel.w - 8;
      const sh = squirrel.h - 8;

      // Ground / ceiling
      if (sy + sh > H - GROUND_H || sy < 0) return true;

      // Pipes
      for (const pipe of pipes) {
        const px = pipe.x;
        const pw = PIPE_W;
        const topH = pipe.topH;
        const botY = topH + PIPE_GAP;

        // Hit top pipe
        if (sx + sw > px && sx < px + pw && sy < topH) return true;
        // Hit bottom pipe
        if (sx + sw > px && sx < px + pw && sy + sh > botY) return true;
      }

      return false;
    }

    function update() {
      frameCount++;

      if (gameState === 'playing') {
        // Physics
        squirrel.vy += squirrel.gravity;
        squirrel.y += squirrel.vy;

        // Ground scroll
        groundX -= PIPE_SPEED;

        // Pipe spawning
        if (frameCount % PIPE_SPAWN === 0) {
          spawnPipe();
        }

        // Move pipes
        pipes.forEach(pipe => {
          pipe.x -= PIPE_SPEED;
          // Score
          if (!pipe.scored && pipe.x + PIPE_W < squirrel.x) {
            pipe.scored = true;
            score++;
          }
        });

        // Move bonus nuts
        bonusNuts.forEach(nut => {
          nut.x -= PIPE_SPEED;
        });

        // Collect bonus nuts
        bonusNuts.forEach(nut => {
          if (nut.collected) return;
          const dx = (squirrel.x + squirrel.w / 2) - nut.x;
          const dy = (squirrel.y + squirrel.h / 2) - nut.y;
          if (Math.sqrt(dx * dx + dy * dy) < 20) {
            nut.collected = true;
            score += 2;
            spawnParticles(nut.x, nut.y, COLORS.gold, 10);
          }
        });

        // Clean up off-screen
        pipes = pipes.filter(p => p.x + PIPE_W > -20);
        bonusNuts = bonusNuts.filter(n => n.x > -20 && !n.collected);

        // Collision
        if (checkCollision()) {
          die();
        }
      }

      // Update particles
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        p.vy += 0.1;
      });
      particles = particles.filter(p => p.life > 0);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      drawBackground();

      // Pipes behind squirrel
      pipes.forEach(drawPipe);

      // Bonus nuts
      bonusNuts.filter(n => !n.collected).forEach(drawBonusNut);

      drawGround();
      drawParticles();
      drawSquirrel();

      if (gameState === 'playing') {
        drawScore();
      } else if (gameState === 'start') {
        drawSquirrel();
        drawStartScreen();
      } else if (gameState === 'dead') {
        drawScore();
        drawDeathScreen();
      }
    }

    // ═══ GAME LOOP ═══
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ═══ INPUT ═══
    canvas.addEventListener('click', flap);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    // ═══ RESPONSIVE SIZING ═══
    function resizeCanvas() {
      const maxW = Math.min(window.innerWidth - 32, 400);
      const maxH = Math.min(window.innerHeight * 0.75, 600);
      const scale = Math.min(maxW / 400, maxH / 600);
      canvas.style.width = (400 * scale) + 'px';
      canvas.style.height = (600 * scale) + 'px';
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ═══ START ═══
    gameLoop();
  </script>
</body>
</html>
