<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0613">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RuneScape Classic — Fuzzynuts Arcade</title>
  <meta name="description" content="Play RuneScape Classic in your browser via Open-RSC. No downloads, no Java. Part of the Fuzzynuts Arcade on XRPL.">
  <link rel="icon" href="../../logo_512.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>

  <!-- Shared arcade shell — ALL game pages use this -->
  <link rel="stylesheet" href="../../css/design-tokens.css">
  <link rel="stylesheet" href="../../css/arcade-shell.css?v=mobile-fix">

  <style>
    /* Landing screen */
    .ext-landing {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem 1rem; min-height: calc(100dvh - 60px);
    }
    .ext-landing.hidden { display: none; }
    .ext-icon { font-size: 3rem; margin-bottom: 1rem; }
    .ext-title {
      font-family: var(--font-display, 'Outfit', system-ui, sans-serif);
      font-size: 1.5rem; font-weight: 700;
      color: var(--arcade-accent, #fbbf24); margin-bottom: 0.25rem;
    }
    .ext-subtitle { color: var(--text-muted, #9ca3af); font-size: 0.85rem; margin-bottom: 2rem; }
    .ext-play-btn {
      font-family: var(--font-display, 'Outfit', system-ui, sans-serif);
      font-size: 1rem; font-weight: 700;
      background: linear-gradient(135deg, var(--arcade-accent, #fbbf24), var(--arcade-accent-dark, #d4a843));
      color: var(--bg-base, #0a0613); border: none; padding: 1rem 2.5rem;
      border-radius: 0.75rem; cursor: pointer; text-decoration: none;
      display: inline-block; transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .ext-play-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--arcade-accent-glow, rgba(251,191,36,0.4)); }
    .ext-info {
      font-size: 0.85rem; color: var(--text-secondary, #d1d5db);
      line-height: 1.8; max-width: 440px; margin: 2rem auto 0;
    }
    .ext-info .highlight { color: var(--arcade-accent, #fbbf24); }

    /* Game iframe container */
    .ext-game-wrap {
      display: none; width: 100%; height: calc(100dvh - 60px); background: #000;
    }
    .ext-game-wrap.visible { display: flex; align-items: center; justify-content: center; }
    .ext-game-wrap iframe { width: 765px; height: 503px; max-width: 100%; border: 0; display: block; }

    @media (max-width: 768px) {
      .ext-landing { padding: 1.5rem 1rem; }
      .ext-icon { font-size: 2.5rem; }
      .ext-title { font-size: 1.35rem; }
      .ext-game-wrap iframe { width: 100vw; height: calc(100dvh - 60px); }
    }
  </style>
</head>
<body>
  <!-- Nav injected by arcade-shell.js -->

  <!-- Landing screen -->
  <div class="ext-landing" id="extLanding">
    <div class="ext-icon">⚔️🏰</div>
    <h1 class="ext-title">RuneScape Classic</h1>
    <p class="ext-subtitle">Browser MMORPG — Powered by Open-RSC</p>
    <button type="button" class="ext-play-btn" id="extPlayBtn">⚔️ Play Now</button>
    <div class="ext-info">
      <p>The original 2001 RuneScape — playable in your browser.</p>
      <p>Explore, quest, skill, and PK in the classic world. Create a character on first login.</p>
      <p class="highlight">🌰 No downloads or Java needed — click and play</p>
    </div>
  </div>

  <!-- Game iframe (shown after clicking Play) -->
  <div class="ext-game-wrap" id="extGameWrap">
    <iframe
      id="gameIframe"
      title="RuneScape Classic — FuzzyNuts"
      allow="autoplay; fullscreen"
      loading="lazy"
    ></iframe>
  </div>

  <!-- Shared arcade shell — MUST be in regular <script>, NOT module -->
  <script src="../../js/arcade-shell.js?v=mobile-fix"></script>
  <script>
    ArcadeShell.init({
      slug: 'rsc',
      title: 'RuneScape Classic',
      icon: '⚔️',
      accentColor: '#22c55e',
      hideNavOnPlay: false,
      showLoader: false,
    });
  </script>

  <!-- Score bridge -->
  <script src="../fuzzy-score.js"></script>

  <script>
    /* RSC server connection params */
    var RSC_CLIENT_BASE = 'https://game.fuzzynuts.xyz';
    var RSA_EXPONENT = '65537';
    var RSA_MODULUS = '9115015542438186018327044408313987277889783174239809826491015549573028356381739563861028029945657804756198333660503635469704152602063914154601665525357981';
    var CLIENT_URL = RSC_CLIENT_BASE + '/#members,game.fuzzynuts.xyz,43494,' + RSA_EXPONENT + ',' + RSA_MODULUS + ',true';

    document.getElementById('extPlayBtn').addEventListener('click', function() {
      document.getElementById('extLanding').classList.add('hidden');
      var frame = document.getElementById('extGameWrap');
      document.getElementById('gameIframe').src = CLIENT_URL;
      frame.classList.add('visible');
    });
  </script>
</body>
</html>
