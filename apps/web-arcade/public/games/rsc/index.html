<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0613">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RuneScape Classic — Fuzzynuts Arcade</title>
  <meta name="description" content="Play RuneScape Classic in your browser via Open-RSC. No downloads, no Java. Part of the Fuzzynuts Arcade on XRPL.">
  <link rel="canonical" href="https://fuzzynuts.xyz/games/rsc/" />
  <link rel="icon" href="../../logo_512.png" type="image/png">

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="RuneScape Classic — Fuzzynuts Arcade" />
  <meta property="og:description" content="The original 2001 RuneScape in your browser. No downloads. Click and play." />
  <meta property="og:url" content="https://fuzzynuts.xyz/games/rsc/" />

  <!-- Fonts: non-blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>

  <!-- Shared arcade shell -->
  <link rel="stylesheet" href="../../css/design-tokens.css">
  <link rel="stylesheet" href="../../css/arcade-shell.css?v=rsc-launch">

  <style>
    /* ── RSC landing screen ── */
    .rsc-landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
      min-height: calc(100dvh - 60px);
    }
    .rsc-landing.hidden { display: none; }

    .rsc-icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .rsc-title {
      font-family: var(--font-display, 'Outfit', system-ui, sans-serif);
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--arcade-accent, #fbbf24);
      margin-bottom: 0.25rem;
    }
    .rsc-subtitle {
      color: var(--text-muted, #9ca3af);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }
    .rsc-play-btn {
      font-family: var(--font-display, 'Outfit', system-ui, sans-serif);
      font-size: 1.05rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--arcade-accent, #fbbf24), var(--arcade-accent-dark, #d4a843));
      color: var(--bg-base, #0a0613);
      border: none;
      padding: 1rem 2.5rem;
      border-radius: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .rsc-play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px var(--arcade-accent-glow, rgba(251,191,36,0.4));
    }
    .rsc-info {
      font-size: 0.85rem;
      color: var(--text-secondary, #d1d5db);
      line-height: 1.8;
      max-width: 440px;
      margin: 2rem auto 0;
    }
    .rsc-info .highlight { color: var(--arcade-accent, #fbbf24); }

    /* ── Game iframe container ── */
    .rsc-game-wrap {
      display: none;
      width: 100%;
      height: calc(100dvh - 60px);
      background: #000;
    }
    .rsc-game-wrap.visible {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rsc-game-wrap iframe {
      width: 765px;
      height: 503px;
      max-width: 100%;
      border: 0;
      display: block;
    }

    /* ── Particles ── */
    .rsc-particles {
      position: fixed; inset: 0;
      pointer-events: none; overflow: hidden; z-index: -1;
    }
    .rsc-particle {
      position: absolute; font-size: 16px; opacity: 0.12;
      animation: rsc-fall linear infinite;
    }
    @keyframes rsc-fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.12; }
      90%  { opacity: 0.12; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .rsc-landing { padding: 1.5rem 1rem; }
      .rsc-icon { font-size: 2.5rem; }
      .rsc-title { font-size: 1.35rem; }
      .rsc-game-wrap iframe {
        width: 100vw;
        height: calc(100dvh - 60px);
      }
    }
  </style>
</head>
<body>
  <!-- Nav injected by arcade-shell.js -->

  <div class="rsc-particles" id="rscParticles"></div>

  <!-- Landing screen -->
  <div class="rsc-landing" id="rscLanding">
    <div class="rsc-icon">⚔️🏰</div>
    <h1 class="rsc-title">RuneScape Classic</h1>
    <p class="rsc-subtitle">Browser MMORPG — Powered by Open-RSC</p>

    <button type="button" class="rsc-play-btn" id="rscPlayBtn">⚔️ Play Now</button>

    <div class="rsc-info">
      <p>The original 2001 RuneScape — playable in your browser.</p>
      <p>Explore, quest, skill, and PK in the classic world. Create a character on first login.</p>
      <p class="highlight">🌰 No downloads or Java needed — click and play</p>
    </div>
  </div>

  <!-- Game iframe (shown after clicking Play) -->
  <div class="rsc-game-wrap" id="rscGameWrap">
    <iframe
      id="rscIframe"
      title="RuneScape Classic — FuzzyNuts"
      allow="autoplay; fullscreen"
      loading="lazy"
    ></iframe>
  </div>

  <!-- Shared arcade shell -->
  <script src="../../js/arcade-shell.js?v=rsc-launch"></script>
  <script>
    ArcadeShell.init({
      slug: 'rsc',
      title: 'RuneScape Classic',
      icon: '⚔️',
      accentColor: '#22c55e',
      hideNavOnPlay: false,
      showLoader: false,
    });
  </script>

  <!-- Score bridge -->
  <script src="../fuzzy-score.js"></script>

  <script>
    /* ── RSC server connection params ── */
    var RSC_CLIENT_BASE = 'https://game.fuzzynuts.xyz';
    var RSA_EXPONENT = '65537';
    var RSA_MODULUS = '9115015542438186018327044408313987277889783174239809826491015549573028356381739563861028029945657804756198333660503635469704152602063914154601665525357981';
    var CLIENT_URL = RSC_CLIENT_BASE + '/#members,game.fuzzynuts.xyz,43494,' + RSA_EXPONENT + ',' + RSA_MODULUS + ',true';

    /* ── Launch game on button click ── */
    document.getElementById('rscPlayBtn').addEventListener('click', function() {
      var landing = document.getElementById('rscLanding');
      var gameWrap = document.getElementById('rscGameWrap');
      var iframe = document.getElementById('rscIframe');

      iframe.src = CLIENT_URL;
      landing.classList.add('hidden');
      gameWrap.classList.add('visible');
    });

    /* ── Forest particle effect ── */
    var emojis = ['🌰', '🍂', '🍁', '🌿', '🥜', '🐿️'];
    var container = document.getElementById('rscParticles');
    for (var i = 0; i < 15; i++) {
      var el = document.createElement('span');
      el.className = 'rsc-particle';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (8 + Math.random() * 12) + 's';
      el.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(el);
    }
  </script>
</body>
</html>
