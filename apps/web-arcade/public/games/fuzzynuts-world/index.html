<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0613">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fuzzynuts World — Fuzzynuts Arcade</title>
  <meta name="description" content="Enter Fuzzynuts World, a private 2D MMORPG adventure. Explore, quest, and compete on the XRPL-powered Fuzzynuts Arcade.">
  <link rel="icon" href="../../logo_512.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>

  <!-- Shared arcade shell — ALL game pages use this -->
  <link rel="stylesheet" href="../../css/design-tokens.css">
  <link rel="stylesheet" href="../../css/arcade-shell.css?v=mobile-fix">

  <style>
    /* Landing screen */
    .ext-landing {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem 1rem; min-height: calc(100dvh - 60px);
    }
    .ext-landing.hidden { display: none; }
    .ext-icon { font-size: 3rem; margin-bottom: 1rem; }
    .ext-title {
      font-family: var(--font-display, 'Outfit', system-ui, sans-serif);
      font-size: 1.5rem; font-weight: 700;
      color: var(--arcade-accent, #fbbf24); margin-bottom: 0.25rem;
    }
    .ext-subtitle { color: var(--text-muted, #9ca3af); font-size: 0.85rem; margin-bottom: 2rem; }
    .ext-play-btn {
      font-family: var(--font-display, 'Outfit', system-ui, sans-serif);
      font-size: 1rem; font-weight: 700;
      background: linear-gradient(135deg, var(--arcade-accent, #fbbf24), var(--arcade-accent-dark, #d4a843));
      color: var(--bg-base, #0a0613); border: none; padding: 1rem 2.5rem;
      border-radius: 0.75rem; cursor: pointer; text-decoration: none;
      display: inline-block; transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .ext-play-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--arcade-accent-glow, rgba(251,191,36,0.4)); }
    .ext-info {
      font-size: 0.85rem; color: var(--text-secondary, #d1d5db);
      line-height: 1.8; max-width: 440px; margin: 2rem auto 0;
    }
    .ext-info .highlight { color: var(--arcade-accent, #fbbf24); }

    /* Particles */
    .particles {
      position: fixed; inset: 0;
      pointer-events: none; overflow: hidden; z-index: -1;
    }
    .particle {
      position: absolute; font-size: 16px; opacity: 0.12;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.12; }
      90%  { opacity: 0.12; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Nav injected by arcade-shell.js -->

  <div class="particles" id="particles"></div>

  <!-- Landing screen -->
  <div class="ext-landing" id="extLanding">
    <div class="ext-icon">🐿️⚔️</div>
    <h1 class="ext-title">Fuzzynuts World</h1>
    <p class="ext-subtitle">A Private MMORPG Adventure</p>
    <button type="button" class="ext-play-btn" id="extPlayBtn">⚔️ Enter World</button>
    <div class="ext-info">
      <p>Explore a persistent 2D fantasy world.</p>
      <p>Create a character, complete quests, battle monsters, and compete with other players.</p>
      <p class="highlight">🌰 Powered by the Fuzzynuts Arcade on XRPL</p>
    </div>
  </div>

  <!-- Shared arcade shell — MUST be in regular <script>, NOT module -->
  <script src="../../js/arcade-shell.js?v=mobile-fix"></script>
  <script>
    ArcadeShell.init({
      slug: 'fuzzynuts-world',
      title: 'Fuzzynuts World',
      icon: '🌍',
      accentColor: '#4ade80',
      hideNavOnPlay: false,
      showLoader: false,
    });
  </script>

  <!-- Score bridge -->
  <script src="../fuzzy-score.js"></script>

  <script>
    var WORLD_URL = 'https://world.fuzzynuts.xyz';

    document.getElementById('extPlayBtn').addEventListener('click', function() {
      window.open(WORLD_URL, '_blank');
    });

    // Forest particle effect
    var emojis = ['🌰', '🍂', '🍁', '🌿', '🥜', '🐿️'];
    var container = document.getElementById('particles');
    for (var i = 0; i < 15; i++) {
      var el = document.createElement('span');
      el.className = 'particle';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (8 + Math.random() * 12) + 's';
      el.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(el);
    }
  </script>
</body>
</html>
