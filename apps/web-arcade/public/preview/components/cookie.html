<!-- ============================== Cookie Consent ============================== -->
<div class="fn-cookie" id="cookie-banner" role="dialog" aria-label="Cookie consent" aria-live="polite">
  <div class="fn-cookie__inner">
    <p class="fn-cookie__text">
      We use cookies to improve your experience and analyze traffic. By continuing, you agree to our use of cookies. <a href="/cookies">Learn more</a>.
    </p>
    <div class="fn-cookie__actions">
      <button class="fn-cookie__btn fn-cookie__btn--accept" id="cookie-accept" type="button">Accept</button>
      <button class="fn-cookie__btn fn-cookie__btn--manage" id="cookie-manage" type="button">Manage</button>
    </div>
  </div>
</div>
