[package]
name = "fuzzynuts-desktop"
version = "0.1.0"
description = "Fuzzynuts Arcade — desktop shell"
authors = ["Fuzzynuts <hello@fuzzynuts.xyz>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fuzzynuts_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
