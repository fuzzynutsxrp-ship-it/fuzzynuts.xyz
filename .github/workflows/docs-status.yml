name: docs/STATUS.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain docs/STATUS.md)" ]]; then
            git config user.name  "fuzzynuts-bot"
            git config user.email "actions@fuzzynuts.xyz"
            git add docs/STATUS.md
            git commit -m "chore(status): regenerate docs/STATUS.md [skip ci]"
            git push
          fi
